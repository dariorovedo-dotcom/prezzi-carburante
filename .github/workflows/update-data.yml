name: Aggiorna i dati

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

# Necessario per il "git push" finale
permissions:
  contents: write

jobs:
  controlla-e-aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Diagnosi: non blocca mai il workflow, serve solo a capire dove nasce il problema
      - name: Diagnosi connessione MIMIT
        continue-on-error: true
        run: |
          echo "IP e paese del runner:"
          curl -s --max-time 15 https://ipinfo.io/json || echo "ipinfo non raggiungibile"
          echo
          URL="https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"
          echo "--- Test IPv4 ---"
          curl -4 -sS -o /dev/null -w "HTTP %{http_code} | connessione %{time_connect}s | totale %{time_total}s\n" \
            --connect-timeout 30 --max-time 60 -r 0-1023 "$URL" || echo "IPv4: FALLITO"
          echo "--- Test IPv6 ---"
          curl -6 -sS -o /dev/null -w "HTTP %{http_code} | connessione %{time_connect}s | totale %{time_total}s\n" \
            --connect-timeout 15 --max-time 30 -r 0-1023 "$URL" || echo "IPv6: FALLITO (normale sui runner GitHub)"

      - name: Scarica i CSV dal MIMIT
        run: |
          set -euo pipefail

          download_csv() {
            local url="$1"
            local file="$2"

            echo "=== Download $file ==="

            # -4: forza IPv4 | connect-timeout più lungo | 6 tentativi a 30 s di distanza
            if ! curl -4 -L -f -sS \
              --connect-timeout 60 \
              --max-time 300 \
              --retry 6 \
              --retry-delay 30 \
              --retry-max-time 900 \
              --retry-all-errors \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: it-IT,it;q=0.9" \
              -H "Referer: https://www.mimit.gov.it/it/open-data/elenco-dataset/carburanti-prezzi-praticati-e-anagrafica-degli-impianti" \
              -o "${file}.part" \
              "$url"; then

              echo "::error::Download fallito per $file (vedi lo step 'Diagnosi connessione MIMIT')"
              rm -f "${file}.part"
              return 1
            fi

            if [ ! -s "${file}.part" ]; then
              echo "::error::File vuoto: $file"
              rm -f "${file}.part"
              return 1
            fi

            mv "${file}.part" "$file"

            echo "Download completato: $file"
            echo "Dimensione: $(wc -c < "$file") bytes"
            echo "Prime 3 righe:"
            head -3 "$file"
          }

          download_csv \
            "https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv" \
            "prezzo_alle_8.csv"

          download_csv \
            "https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv" \
            "anagrafica_impianti_attivi.csv"

      - name: Verifica che i file siano validi
        run: |
          set -euo pipefail

          if ! grep -q "idImpianto" prezzo_alle_8.csv; then
            echo "ERRORE: prezzo_alle_8.csv non valido."
            echo "Contenuto ricevuto:"
            head -10 prezzo_alle_8.csv
            exit 1
          fi

          if ! grep -q "idImpianto" anagrafica_impianti_attivi.csv; then
            echo "ERRORE: anagrafica_impianti_attivi.csv non valido."
            echo "Contenuto ricevuto:"
            head -10 anagrafica_impianti_attivi.csv
            exit 1
          fi

          echo "Entrambi i file sono validi!"

          head -1 prezzo_alle_8.csv > ultima_estrazione.txt

      - name: Commit e push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add prezzo_alle_8.csv anagrafica_impianti_attivi.csv ultima_estrazione.txt

          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Aggiornamento dati: $(cat ultima_estrazione.txt)"
            git push
          fi
